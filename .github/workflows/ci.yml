name: Security Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make libssl-dev python3 python3-venv lcov socat
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Compile Server
      run: make all

    - name: Generate PKI
      run: |
        source venv/bin/activate
        make pki

    - name: Run Integration Tests
      run: |
        source venv/bin/activate
        make test