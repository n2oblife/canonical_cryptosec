stages:
  - build
  - test

image: ubuntu:22.04

before_script:
  - apt-get update -qq
  - apt-get install -y -qq gcc make libssl-dev python3 python3-venv lcov
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install -r requirements.txt

build_server:
  stage: build
  script:
    - make all
  artifacts:
    paths:
      - build/bin/crypto_server

integration_tests:
  stage: test
  script:
    - source venv/bin/activate
    - make pki
    - make test